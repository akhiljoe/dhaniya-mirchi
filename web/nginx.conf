# The only thing a browser talks to (design §11).
#
# /auth/ and /api/ MUST be proxied to the api. Without these blocks nginx
# answers every auth route with index.html and a 200 — sign-in "does nothing"
# and nothing is logged anywhere (the costliest bug in an earlier project's sign-in).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 64k;

    # The web app manifest (Add to Home Screen, design §13.1): nginx's stock
    # types don't know .webmanifest and would serve it as octet-stream.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Resolve the api through Docker's DNS at request time, not once at
    # startup: otherwise recreating the api container (every deploy) leaves
    # nginx proxying to its old IP — a 502 until web is restarted too (seen).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # Security headers on every response. The SPA loads nothing from other
    # origins except its two web fonts (Fraunces, Plus Jakarta Sans) from
    # Google Fonts: the stylesheet host and the font-file host, nothing else.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /auth/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Vite's hashed bundles never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else is the SPA; index.html is never cached so a deploy is
    # picked up immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }
}
